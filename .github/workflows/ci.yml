# CI de Farsante Scrum (propuesta de docs/operations/deployment-and-rollback.md §2).
# Sin secretos: las pruebas usan memoria y Redis SIMULADO. No despliega.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación reproducible
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Sintaxis
        run: npm run check
      - name: Build (copia la biblioteca QR)
        run: npm run build
      - name: Pruebas de dominio, API y concurrencia (Redis simulado)
        run: npm test
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: E2E (escritorio y móvil emulado)
        run: npm run test:e2e
